services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_MODE: telegram
      PORT: 3001
      DB_PATH: /app/data/games.sqlite
      PUBLIC_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      BOT_USERNAME: ${BOT_USERNAME:?Set BOT_USERNAME in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    volumes:
      - games:/app/data
    expose:
      - "3001"
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
volumes:
  games:
  caddy-data:
  caddy-config:
